# infrastructure/apps/linkding/base/helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: linkding-hr
spec:
  interval: 1h
  chart:
    spec:
      chart: linkding
      version: "3.0.0"
      sourceRef:
        kind: HelmRepository
        name: pascaliske
        namespace: flux-system

  # Ensure the Database and Secret exist before deploying
  dependsOn:
    - name: linkding-db
    - name: linkding-es

  targetNamespace: linkding

  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: linkding-db
      namespace: linkding

    # 1. Controller Logic (Replicas & Resources)
  values:
    controller:
      type: deployment
      # The chart uses 'updateStrategy' to map to K8s 'strategy'
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      replicas: 1
      # Define how the pod should behave during restarts
      strategy: RollingUpdate
      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 20
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10

    # 2. Resources Management
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    # 3. Image (Pinned Version)
    image:
      repository: ghcr.io/sissbruecker/linkding
      pullPolicy: IfNotPresent
      tag: "1.45.0-plus"

    # 4. Networking (Internal Port)
    ports:
      http:
        port: 9090

    # 5. Storage Logic
    persistentVolumeClaim:
      create: false # Tell the chart NOT to try creating its own PVC
      existingPersistentVolumeClaim: "linkding-pvc-static" # Link to the manual one
      name: "linkding-pvc"
      storageClassName: "longhorn"
      accessMode: "ReadWriteOnce"
      size: "1Gi"
      mountPath: "/etc/linkding/data"

    # 6. Environment & Secrets
    envFrom:
      - configMapRef:
          name: linkding-configmap
      - secretRef:
          name: linkding-env-secrets
    # 7. Labels
    podLabels:
      # This ensures the Pod carries the identity that the CNP expects
      athanor.io/gateway-zone: internal
      # This ensures the Pod is recognized as the 'linkding' app
      app.kubernetes.io/name: linkding
