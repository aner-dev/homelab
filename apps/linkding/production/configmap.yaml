apiVersion: v1
kind: ConfigMap
metadata:
  name: linkding-configmap
  namespace: linkding
  labels:
    app.kubernetes.io/name: linkding
    app.kubernetes.io/part-of: athanor-core
data:
  LD_SERVER_PORT: "9090" # Matches the HTTPRoute port
  LD_DB_ENGINE: postgres
  LD_DB_DATABASE: linkding
  LD_DB_PORT: "5432"
  # Using FQDN for cross-namespace resilience
  LD_DB_HOST: linkding-db-production-v6-rw.linkding.svc.cluster.local
