# apps/observability/gotify/gotify-sync.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gotify-sync
  namespace: flux-system
spec:
  targetNamespace: gotify
  interval: 1h
  path: ./apps/observability/gotify/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # 4. Governance Labels applied uniformly to every child resource generated by this loop
  commonMetadata:
    labels:
      athanor.io/environment: "production"
      athanor.io/owner: "aner"
      athanor.io/criticality: "tier-2"
