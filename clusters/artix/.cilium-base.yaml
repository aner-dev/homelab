apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-controller
  namespace: flux-system
spec:
  interval: 1h
  path: "./infrastructure/controllers/cilium/base"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - kind: Deployment
      name: cilium-operator
      namespace: cilium
