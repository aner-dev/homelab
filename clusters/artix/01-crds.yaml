apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crd-layer
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/crds
  prune: true
  wait: true # Crucial: Flux won't move to Layer 02 until CRDs are established
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
