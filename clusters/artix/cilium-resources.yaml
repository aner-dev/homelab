apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-base
  interval: 1h
  path: "./infrastructure/controllers/cilium/production" # Points to Pools/Policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
