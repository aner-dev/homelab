apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: layer-03-configs
  namespace: flux-system
spec:
  # --- THE DEPENDENCY CHAIN ---
  dependsOn:
    - name: layer-02-controllers

  interval: 15m
  retryInterval: 2m
  path: ./infrastructure/configs
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system

  commonMetadata:
    labels:
      app.kubernetes.io/part-of: platform-foundation
      app.kubernetes.io/component: state-and-secrets
    annotations:
      athanor.io/owner: "aner"
      athanor.io/description: "Manages persistent storage (Postgres) and sensitive data (OpenBao/ESO)."
