# ClusterExternalSecret for harbor deployment
# infrastructure/configs/harbor-registry-auth-ces.yaml
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: harbor-pull-secret-ces
spec:
  # The name of the ExternalSecret that will be generated in each namespace
  externalSecretName: harbor-pull-secret-es

  # Logic: Deploy to any namespace that has this label
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: "linkding" # Direct match for now
    - matchLabels:
        registry-auth: "enabled" # Future-proof: any namespace with this label gets the secret

  refreshTime: "1m"

  externalSecretSpec:
    secretStoreRef:
      name: vault-backend # Your ClusterSecretStore pointing to OpenBao
      kind: ClusterSecretStore

    refreshInterval: "1h"

    target:
      name: harbor-pull-secret # The actual K8s Secret name for your pods
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ .docker_config | toString }}"

    data:
      - secretKey: docker_config
        remoteRef:
          key: secret/data/infrastructure/harbor/pull-secret
          property: config # Assumes you stored the full JSON config in Vault
