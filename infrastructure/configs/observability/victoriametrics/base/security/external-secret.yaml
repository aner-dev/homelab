apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: victoriametrics-secrets
  namespace: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: vm-auth-credentials # The K8s secret name used in VMAgent/VMAuth
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # 1. The reload key for VMAgent
    - secretKey: VMAGENT_RELOAD_AUTH_KEY
      remoteRef:
        key: observability/victoriametrics
        property: reload_key
    # 2. The Discord Webhook for Alertmanager
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: observability/victoriametrics
        property: discord_webhook
    # 3. Credentials for Blackbox (if you probe authenticated sites)
    - secretKey: BLACKBOX_AUTH_TOKEN
      remoteRef:
        key: observability/victoriametrics
        property: blackbox_token
    # 4. S3 Credentials for RustFS (Used by vmbackup sidecar)
    - secretKey: RUSTFS_S3_CONFIG
      remoteRef:
        key: observability/rustfs
        property: s3_config_file # This should contain the [default] aws_access_key... block
    # 5. The Snapshot Auth Key for FOSS Backups
    - secretKey: VM_SNAPSHOT_AUTH_KEY
      remoteRef:
        key: observability/victoriametrics
        property: snapshot_key
