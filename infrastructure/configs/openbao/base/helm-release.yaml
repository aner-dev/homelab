apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  chartRef:
    kind: OCIRepository
    name: openbao-chart
    namespace: flux-system
  interval: 30m
  values:
    server:
      dev:
        enabled: false # Senior tip: never use dev mode in a homelab you care about
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: longhorn
      auditStorage:
        enabled: false # only enable if you have a log rotation strategy
