apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-stable # Your own name, safe from Helm upgrades
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "1" # single-node homelab
  staleReplicaTimeout: "2880"
  fsType: "ext4"
