apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: storage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: rustfs-credentials # This is what RustFS will look for
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: secret/data/rustfs
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: secret/data/rustfs
        property: secret_key
