apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard
  namespace: traefik # CRITICAL: This must match your Gateway namespace
spec:
  # The name of the Secret that Traefik's Gateway is looking for
  secretName: homelab-wildcard-cert

  issuerRef:
    name: vault-issuer # Or letsencrypt-production
    kind: ClusterIssuer

  commonName: "homelab.local"
  dnsNames:
    - "homelab.local"
    - "*.homelab.local" # This covers longhorn, grafana, etc.
