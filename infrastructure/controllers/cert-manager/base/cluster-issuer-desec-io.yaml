# infrastructure/controllers/cert-manager/base/cluster-issuer-desec-io.yaml
# THE EXTERNAL DOOR (ACME/Let's Encrypt)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-desec
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: n0amh4w8@anonaddy.me
    privateKeySecretRef:
      name: letsencrypt-desec-account-key
    profile: classic
    solvers:
      - selector:
        dnsNames:
          - "*.yourdomain.com"
          - "yourdomain.com"
        dns01:
          webhook:
            groupName: acme.desec.io
            solverName: desec
            config:
              apiTokenSecretRef:
                name: desec-api-token
                key: api-token
      # FALLBACK/GENERIC: HTTP-01 for everything else
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: traefik-gateway
                namespace: traefik
                kind: Gateway
            serviceType: ClusterIP
