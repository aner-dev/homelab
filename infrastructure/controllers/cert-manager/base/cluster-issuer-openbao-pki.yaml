apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-pki-issuer
spec:
  vault:
    server: http://openbao.openbao.svc.cluster.local:8200
    path: pki/sign/athanor-dot-local # path to the OpenBao Role
    auth:
      kubernetes:
        role: cert-manager
        mountPath: auth/kubernetes
        serviceAccountRef:
          name: cert-manager
