apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    installCRDs: false
    # monitoring (victoriametrics)
    prometheus:
      enabled: true
      podmonitor:
        enabled: true
        # Explicitly align the endpoint configuration to prevent discovery drops
        interval: 30s
        scrapeTimeout: 10s

    replicaCount: 1 # Production usually uses 3
    config:
      enableGatewayAPI: true
    # Enabling specific Feature Gates using structured fields
    featureGates: "AdditionalCertificateOutputFormats=true,ServerSideApply=true"

    # Enabling specific Feature Gates
    featureGates: "AdditionalCertificateOutputFormats=true,ServerSideApply=true"

    # Resource management
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
