apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cert-manager
      version: "v1.19.x" # Using a semver range is a Senior practice for auto-updates
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    installCRDs: false
    replicaCount: 1 # Production usually uses 3
    extraArgs:
      - --enable-gateway-api

    # Enabling specific Feature Gates
    featureGates: "AdditionalCertificateOutputFormats=true,ServerSideApply=true"

    # Resource management
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
