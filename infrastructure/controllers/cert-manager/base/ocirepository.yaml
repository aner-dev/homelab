apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 12h
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    semver: ">=1.13.0 <1.18.0"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ignore: | # Explicitly telling Flux to ignore non-essential files
    /*
    !/templates/
    !/Chart.yaml
    !/values.yaml
  provider: generic
