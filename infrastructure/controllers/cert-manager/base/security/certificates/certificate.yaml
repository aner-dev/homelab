apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: athanor-wildcard
  namespace: kube-system
spec:
  secretName: athanor-wildcard-cert

  # Optimization: Renew the cert when 1/3 of its life remains (standard practice)
  renewBefore: 360h # 15 days before expiry (assuming a 90-day Let's Encrypt cert)

  # Security: Ensure the secret is only readable by the owner (Traefik)
  secretTemplate:
    annotations:
      reloader.stakater.com/match: "true" # Useful if you use Stakater Reloader
    labels:
      networking.athanor.local/type: wildcard-tls

  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io

  # The "SANs" (Subject Alternative Names)
  commonName: "athanor.local"
  dnsNames:
    - "athanor.local"
    - "*.athanor.local"

  # Modern Security Standard: ECDSA is faster and more secure than RSA
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always # Re-generate the private key on every renewal

  usages:
    - server auth
    - client auth # Often added for full handshake compatibility

  keystores: # see `docs/guides/future-improvements/pkcs12-jks-cert-manager.md`
    pkcs12:
      create: true
      passwordSecretRef:
        name: cert-pass-secret
        key: password
