apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    path: pki/sign/athanor-dot-local # Path in your OpenBao PKI engine
    server: http://openbao-active.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        role: cert-manager-issuer-role
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
