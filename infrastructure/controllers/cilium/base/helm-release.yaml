apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  # --- Helm Chart Spec ---
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.*"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # --- Helm Values ---
  values:
    # --- Cluster name ---
    cluster:
      name: athanor
      id: 1 # Unique ID for multi-cluster routing
    # --- CRDs management (avoid installing them) ---
    crd:
      enabled: false

    # --- Load Balancer Class ---
    loadBalancer:
      enabled: true
      # This tells Cilium to assume control of Services with this class
      # If you leave it empty, it defaults to managing all services.
      # I think that declaring it explicitly is safer for GitOps though.
    # --- Security Relevant Labels ---
    # Signalling the eBPF agent which prefixes to use for identity hashing.
    labels:
      - "k8s:io.kubernetes.pod.namespace"
      - "k8s:app.kubernetes.io/name"
      - "k8s:athanor.io"

    # --- Policy Logic  ---
    kubeProxyReplacement: true
    policyEnforcementMode: "default" # temporal, "always" mode is the ideal state
    policyDenyResponse: "icmp" # communication feedback loop logic
    enablePolicy: "default"

    # --- IPAM / Networking ---
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    routingMode: native
    autoDirectNodeRoutes: true # make all the nodes of the cluster network of pods and its CIDRs
    ipv4NativeRoutingCIDR: "10.42.0.0/16"

    # --- L2 & Gateway API (The New Foundation) ---
    gatewayAPI:
      enabled: true
      enableAlpn: true # Essential optimization for HTTP/2 & gRPC routing

    l2announcements:
      enabled: true
    # network device mapping (L2 requirement)
    devices: "eth0"

    # --- Performance Tuning ---
    k8sClientRateLimit:
      qps: 20 # queries per second
      burst: 40 # Burst: maximum number of requests allowed in a sudden spike
    # `k8sClientRateLimit` controls how many requests the Cilium Agent
    # is allowed to make to the Kubernetes API Server per second.

    # --- Cilium Operator Config ---
    operator:
      replicas: 1

    # --- eBPF Config ---
    bpf:
      preallocateMaps: true

    # --- Service Mesh ---
    l7Proxy: true

    # Envoy proxy
    envoy:
      enabled: true
      log:
        format: "[%Y-%m-%d %T.%e][%t][%l][%n] [%g:%#] %v"

    # Hubble (Observability)
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true

    # Wireguard
    encryption:
      enabled: true
      type: wireguard
    # section moved to a future configuration (mTLS SPIFFE/SPIRE based)
    # 4. Enable Mutual Authentication (security)
    # This will eventually link to an OpenBao/SPIRE setup
    # authentication:
    #   mutual:
    #     spiffe:
    #       enabled: true
    #     # This installs the SPIRE server and agents automatically
    #     spire:
    #       enabled: true
    #       install:
    #         enabled: true
    #         server:
    #           dataStorage:
    #             enabled: false # Use in-memory for your local lab
