apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.*"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # --- Policy Logic  ---
    policyDenyResponse: "icmp" # communication feedback loop logic
    policyEnforcementMode: "default"
    # --- K3s / eBPF Core Logic ---
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 6443
    kubeProxyReplacement: true

    # --- IPAM / Networking ---
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: "10.42.0.0/16"

    # --- L2 & Gateway API (The New Foundation) ---
    gatewayAPI:
      enabled: true
    l2announcements:
      enabled: true
    devices: "eth0"

    # --- Performance Tuning ---
    k8sClientRateLimit:
      qps: 20
      burst: 40

    # --- Operator Config ---
    operator:
      replicas: 1
