apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  # --- Helm Chart Spec ---
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.*"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  # --- Helm Values ---
  values:
    # --- Cluster name ---
    cluster:
      name: athanor
      id: 1 # Unique ID for multi-cluster routing
    # --- CRDs management (avoid installing them) ---
    crd:
      enabled: false

    # --- Load Balancer Class ---
    loadBalancer:
      enabled: true
      # tells Cilium to assume control of LoadBalancer type Services
      # when leaved empty, it defaults to managing all LB services.
      # I think that declaring it explicitly is safer for GitOps though.

    # --- Security Relevant Labels ---
    # Signalling the eBPF agent which prefixes to use for identity hashing.
    # Inclusive whitelist: Only these prefixes are used for identity hashing.
    # Periods must be escaped (\\.) to match literal domain dots in regex.
    labels: "io\\.kubernetes\\.pod\\.namespace app\\.kubernetes\\.io/name athanor\\.io"

    # --- Policy Logic  ---
    kubeProxyReplacement: true
    policyEnforcementMode: "default" # temporal, "always" mode is the ideal state
    policyDenyResponse: "icmp" # communication feedback loop logic
    enablePolicy: "default"

    # --- IPAM / Networking ---
    ipam:
      mode: "cluster-pool" # default kubernetes host-scope mode but controlled by cilium
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    routingMode: native
    autoDirectNodeRoutes: true # make all the nodes of the cluster network of pods and its CIDRs
    ipv4NativeRoutingCIDR: "10.42.0.0/16"

    # --- Gateway API  ---
    gatewayAPI:
      enabled: true
      enableAlpn: true # Essential optimization for HTTP/2 & gRPC routing

    # --- L2 announcements ---
    l2announcements:
      enabled: true

    # Network Device Mapping (L2 requirement)
    devices: "eth0" # This guarantees Cilium binds native eBPF hooks directly onto eth0.

    # --- Performance Tuning ---
    k8sClientRateLimit:
      qps: 20 # queries (requests) per second done by the cilium agent to the K8s API server
      burst: 40 # Burst: maximum number of requests allowed in a sudden spike

    # --- Cilium Operator Config ---
    operator:
      replicas: 1

    # --- eBPF Config (datapath rules) ---
    bpf:
      preallocateMaps: true
      masquerade: true # Tells Cilium HOW to masquerade (using native eBPF)

    # --- Global Masquerade Switch ---
    enableIPv4Masquerade: true # Tells Cilium WHAT to masquerade (turns on IPv4 SNAT globally)

    # --- Fragment Handling & Torrent Optimizations ---
    # Self-documenting flags protecting high-concurrency UDP workloads (Arr Stack/DHT)
    fragmentTracking: true # <-- Global root variable to lock in tracing

    # Optional: Setting extra daemon configurations explicitly as a top-level block helper
    extraConfig:
      bpf-fragments-map-max: "8192" # <-- Protects heavy P2P/DHT scaling overhead

    # --- Service Mesh ---
    l7Proxy: true

    # Envoy proxy
    envoy:
      enabled: true
      log:
        format: "[%Y-%m-%d %T.%e][%t][%l][%n] [%g:%#] %v"

    # Hubble (Observability)
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true

    # Wireguard
    encryption:
      enabled: true
      type: wireguard
    # section moved to a future configuration (mTLS SPIFFE/SPIRE based)
    # 4. Enable Mutual Authentication (security)
    # This will eventually link to an OpenBao/SPIRE setup
    # authentication:
    #   mutual:
    #     spiffe:
    #       enabled: true
    #     # This installs the SPIRE server and agents automatically
    #     spire:
    #       enabled: true
    #       install:
    #         enabled: true
    #         server:
    #           dataStorage:
    #             enabled: false # Use in-memory for your local lab
