apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.19.*"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # --- install CRDs ---
    crd:
      enabled: false
    # --- Policy Logic  ---
    kubeProxyReplacement: true
    policyDenyResponse: "icmp" # communication feedback loop logic
    policyEnforcementMode: "default"

    # --- IPAM / Networking ---
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: "10.42.0.0/16"

    # --- L2 & Gateway API (The New Foundation) ---
    gatewayAPI:
      enabled: true
    l2announcements:
      enabled: true
    devices: "eth0"

    # --- Performance Tuning ---
    k8sClientRateLimit:
      qps: 20 # queries per second
      burst: 40 # Burst: maximum number of requests allowed in a sudden spike
    # `k8sClientRateLimit` controls how many requests the Cilium Agent
    # is allowed to make to the Kubernetes API Server per second.

    # --- Operator Config ---
    operator:
      replicas: 1

    # --- Service Mesh ---
    l7Proxy: true # Envoy proxy

    # 4. Enable Mutual Authentication (security)
    # This will eventually link to an OpenBao/SPIRE setup
    authentication:
      mutual:
        spiffe:
          enabled: true
        # This installs the SPIRE server and agents automatically
        spire:
          enabled: true
          install:
            enabled: true
            server:
              dataStorage:
                enabled: false # Use in-memory for your local lab
    # Observability (Hubble)
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
