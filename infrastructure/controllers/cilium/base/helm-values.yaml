# Core Cilium Configuration for L2 and Performance
kubeProxyReplacement: true

l2announcements:
  enabled: true

# Prevents API Throttling
k8sClientRateLimit:
  qps: 20
  burst: 40

# Ensure the agent knows which interfaces to use for L2
devices: "eth0" # REPLACE this with your actual interface name from 'ip addr'
