apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helm-chart.yaml

helmCharts:
  - name: cilium
    releaseName: cilium
    version: 1.19.1
    repo: https://helm.cilium.io/
    valuesFile: helm-values.yaml
    includeCRDs: true

# This ensures all Cilium resources are labeled for IaC tracking
labels:
  - pairs:
      managed-by: kustomize
      app.kubernetes.io/part-of: cilium-infrastructure
      env: base
