apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helm-repository.yaml
  - helm-release.yaml

# This ensures all Cilium resources are labeled for IaC tracking
labels:
  - pairs:
      managed-by: kustomize
      app.kubernetes.io/part-of: cilium-infrastructure
      env: base
