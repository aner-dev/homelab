apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "l2-announcement-policy"
  namespace: cilium
spec:
  loadBalancerIPs: true
  externalIPs: false

  interfaces:
    - ^eth0$ # logical princple: this should matches the 'ip addr' cli-command output
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  serviceSelector:
    matchLabels:
      athanor.io/ipam-pool: "lan-expose"
      athanor.io/l2-announced: "true"
