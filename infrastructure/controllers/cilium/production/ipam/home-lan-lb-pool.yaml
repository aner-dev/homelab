apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "home-lan-lb-pool"
  namespace: cilium
spec:
  blocks:
    - cidr: "192.168.1.192/29" # 8 IPs: .192 through .199
  serviceSelector:
    matchLabels:
      # Only Services with this label can get an IP from this pool
      io.cilium/ipam-pool: "lan-expose"
