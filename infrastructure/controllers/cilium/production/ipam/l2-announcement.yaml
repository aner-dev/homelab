apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "l2-announcement-policy"
  namespace: cilium
spec:
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - ^eth0$ # this should matches the 'ip addr' cli-command output
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  serviceSelector:
    matchLabels:
      io.cilium/l2-announced: "true"
