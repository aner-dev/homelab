apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "global-zero-trust-baseline"
spec:
  description: "Universal Deny-All with Infrastructure Essentials (DNS & API)."
  endpointSelector: {}

  ingress:
    - fromEntities:
        - host
        - remote-node
        - health

  egress:
    # 1. Core Infrastructure includes the local host API server endpoint for K3s (L3/L4)
    - toEntities: [host, remote-node, health]

    # 2. Internal K8s DNS (service discovery)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY

    # 3. External DNS / Blocky (external resolution)
    - toEndpoints:
        - matchLabels:
            athanor.io/role: dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
