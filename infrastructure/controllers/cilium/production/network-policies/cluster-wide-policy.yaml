apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "global-zero-trust-baseline"
spec:
  description: "Enforces a default-deny ingress/egress posture while permitting core cluster infrastructure communications."
  endpointSelector: {}

  ingress:
    fromEntities:
      - host
      - remote-node
  egress:
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
        - health
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns

    - toServices:
        - k8sService:
            serviceName: blocky
            namespace: blocky
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toServices:
        - k8sService:
            serviceName: traefik
            namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
