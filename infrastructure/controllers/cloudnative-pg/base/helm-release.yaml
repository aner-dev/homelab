apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  releaseName: cnpg
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.27.*"
      sourceRef:
        kind: HelmRepository
        name: cnpg-oci
  install:
    createNamespace: true
  values:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 500Mi
