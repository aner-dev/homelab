# infrastructure/controllers/headscale-operator/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: headscale-operator
  chart:
    spec:
      # The chart engine appends this identifier to the base OCI repository prefix
      chart: headscale-operator
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: headscale-operator
        namespace: flux-system
  # Force Flux to actively remediate and rotate CRDs
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
