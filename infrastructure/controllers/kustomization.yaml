apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # --- Network & Data Plane Routing (CNI & Ingress Controller) ---
  - cilium/production
  - traefik/production

  # --- Storage & Provisioning ---
  - local-path/production
  - longhorn/production

  # --- Security & Secrets ---
  - cert-manager/production
  - eso/production

  # --- Managed Database Platforms ---
  - cloudnative-pg/production

  # --- Observability, Telemetry & Maintenance Foundations ---
  - victoriametrics/production
  - node-exporter/ # Flat layout (No production overlay subfolder)
  - velero/production

  # --- Multi-tenant Ecosystem Extension ---
  - headscale-operator/ # Flat layout (No production overlay subfolder)
  - rustfs/production
