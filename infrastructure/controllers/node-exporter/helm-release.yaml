# infrastructure/controllers/node-exporter/helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: node-exporter
spec:
  interval: 1h
  chart:
    spec:
      sourceRef:
        kind: OCIRepository
        name: prometheus-node-exporter
        namespace: flux-system

  values:
    # --- Performance & Safety ---
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi

    # --- Networking (Host Access) ---
    hostNetwork: true
    hostPID: true
    service:
      port: 9100
      listenOnAllInterfaces: true # Senior choice: explicit binding

    # --- Security & Documentation ---
    rbac:
      create: true
    serviceAccount:
      create: true
      automountServiceAccountToken: false # K8S API communication isn't necessary (it just needs kernel communication)

    # --- Observability Meta ---
    releaseLabel: true
    prometheus:
      monitor:
        enabled: false # Explicitly disabled: using VMNodeScrape instead

    hostRootFsMount:
      enabled: true
      mountPropagation: HostToContainer
    # --- Collectors Configuration & Flags ---
    extraArgs:
      # check https://github.com/prometheus/node_exporter for the default enable list
      - --path.rootfs=/host
      - --collector.nvme
      - --collector.hwmon
      # New: Monitor your Integrated Radeon Graphics
      - --collector.drm
      # New: Monitor process count and states
      - --collector.processes
      # Exclude the "junk" virtual mounts created by k8s/containerd
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
      # Disable collectors that don't apply to a desktop/server build
      - --no-collector.wifi
      - --no-collector.zfs
      # Disable systemd explicitly since I use OpenRC
      - --no-collector.systemd
