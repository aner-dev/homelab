apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-base
  namespace: traefik
  annotations:
    lbipam.cilium.io/ips: "192.168.1.195"

spec:
  releaseName: traefik
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: traefik
      version: "39.0.*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true # Forces a fix on the next attempt
    cleanupOnFail: true # Removes orphaned resources from failed installs
  driftDetection:
    mode: enabled
  values:
    deployment:
      podLabels:
        networking.athanor.local/role: gateway
        networking.athanor.local/zone: internal # Adjust for your external instance
    service:
      enabled: true
      type: LoadBalancer
      # The Label that connects Traefik to your 'home-lan-lb-pool'
      labels:
        io.cilium/ipam-pool: "lan-expose"
      # The Annotation that "pins" the specific IP
      annotations:
        lbipam.cilium.io/ips: "192.168.1.192"
      spec:
        externalTrafficPolicy: Local # Preserves Client Source IP

    providers:
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: true

    # Inside values:
    ingressRoute:
      dashboard:
        enabled: false # We are "outsourcing" this to a separate manifest

    logs:
      general:
        level: "INFO"
      access:
        enabled: true # Highly recommended for debugging L7
