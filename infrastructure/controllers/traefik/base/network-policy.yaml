apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: ingress-traefik-from-external
  namespace: traefik
spec:
  description: "Allow Traefik to route traffic, talk to API, and expose dashboard."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  ingress:
    # 1. Allow external/host traffic (HTTP/HTTPS)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egress:
    # 2. Management: Watch Gateway resources
    - toEntities:
        - kube-apiserver
    # 3. Routing: Send traffic to any app (Restricted by port if possible)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": "*"
    # 4. Infrastructure: Talk to Cert-Manager for TLS challenges
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cert-manager
