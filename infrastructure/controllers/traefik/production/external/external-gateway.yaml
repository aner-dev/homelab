apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: traefik
  labels:
    gateway: external
    io.kubernetes.protocol/gateway: "true" # The key that unlocks the CCNP egress
spec:
  gatewayClassName: traefik-external
  listeners:
    listeners:
      - name: http-redirect
        protocol: HTTP
        port: 80
        # Traefik handles the redirect logic via a middleware or route rule
        allowedRoutes:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                networking.homelab.local/external-gateway-access: "true"
      - name: https
        protocol: HTTPS
        port: 443
        hostname: "*.yourdomain.com"
        tls:
          mode: Terminate
          certificateRefs:
            - name: public-wildcard-cert
        allowedRoutes:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                # Refactored for consistency with your internal gateway
                networking.homelab.local/external-gateway-access: "true"
