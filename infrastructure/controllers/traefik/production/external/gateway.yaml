apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: traefik
  labels:
    gateway: external
spec:
  gatewayClassName: traefik-external
  addresses:
    - value: 192.168.1.200
      type: IPAddress
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.yourdomain.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              exposure: public
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-wildcard-cert
