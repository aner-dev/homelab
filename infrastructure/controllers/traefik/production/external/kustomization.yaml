apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-gateway.yaml
  - gateway-class.yaml

patches:
  - target:
      kind: HelmRelease
      name: traefik-base
    patch: |-
      - op: replace
        path: /metadata/name
        value: traefik-external
      - op: replace
        path: /spec/releaseName
        value: traefik-external
      - op: add
        path: /spec/values/providers/kubernetesGateway/labelSelector
        value: "gateway=external"
      - op: add
        path: /spec/values/deployment # <-- THE IDENTITY LAYER
        value:
          podLabels:
            athanor.io/gateway-zone: "external"
