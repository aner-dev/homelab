apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: traefik
  labels:
    # Standardized Taxonomy
    athanor.io/role: gateway
    athanor.io/network-zone: public
spec:
  gatewayClassName: traefik-public
  listeners:
    - name: https
      protocol: HTTPS
      port: 80
      # Traefik handles the redirect logic via a middleware or route rule
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              athanor.io/gateway-scope: "public"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.yourdomain.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: athanor-wildcard-cert
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              athanor.io/gateway-scope: "public"
