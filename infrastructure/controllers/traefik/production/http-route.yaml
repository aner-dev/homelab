apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  # We attach to 'internal' to keep the UI off the public internet.
  parentRefs:
    - name: internal-gateway
      namespace: traefik
  hostnames:
    - "traefik.athanor.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api@internal
          kind: TraefikService
