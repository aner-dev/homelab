apiVersion: gateway.networking.k8s.io/v1
kind: Gateway #TODO: read `vim.lsp.buf.hover()` help page
metadata:
  name: internal-gateway
  namespace: traefik
  labels:
    gateway: internal
spec:
  gatewayClassName: traefik-internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: # the `Exceptions`
        namespaces:
          from: All
    - name: websecure
      protocol: HTTPS
      port: 443
      allowedRoutes:
        from: Selector
        selector:
          matchLabels:
            # Only namespaces with this label can attach to this Gateway
            networking.homelab.local/internal-gateway-access: "true"

      # - name: minecraft <- see `docs/guides/future-improvements`
      #   protocol: TCP
      #   port: 25565
      #   allowedRoutes:
      #     namespaces:
      #       from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: homelab-wildcard-cert # This will be created later with Cert-Manager

