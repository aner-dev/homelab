apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: traefik
  labels:
    gateway: internal
    io.kubernetes.protocol/gateway: "true" # The key that unlocks the CCNP egress
spec:
  gatewayClassName: traefik-internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              # Only namespaces with this label can attach to this Gateway
              networking.homelab.local/internal-gateway-access: "true"
    - name: websecure
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              networking.homelab.local/internal-gateway-access: "true"

      tls:
        mode: Terminate
        certificateRefs:
          - name: homelab-wildcard-cert # This will be created later with Cert-Manager

