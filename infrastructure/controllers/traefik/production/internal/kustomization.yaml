resources:
  - ../../base # 1. Pull the base chart/repo
  - internal-gateway.yaml # 2. Add the specific gateway
  - gateway-class.yaml # 3. Add the class definition

patches:
  - target:
      kind: HelmRelease
      name: traefik-base
    patch: |-
      - op: replace
        path: /metadata/name
        value: traefik-internal
      - op: replace
        path: /spec/releaseName
        value: traefik-internal
      - op: add
        path: /spec/values/providers/kubernetesGateway/labelSelector
        value: "gateway=internal"
      - op: add
        path: /spec/values/deployment # <-- THE IDENTITY LAYER
        value: 
          podLabels:
            athanor.io/gateway-zone: "internal"
