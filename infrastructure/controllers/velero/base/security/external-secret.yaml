apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-s3-creds
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: velero-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: path/to/secret
        property: token
