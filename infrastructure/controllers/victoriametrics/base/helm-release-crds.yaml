apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: victoriametrics-crds
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-operator-crds
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics-oci
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
