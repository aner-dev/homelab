# infrastructure/crds/external-secrets/sync.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: src-cert-manager
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/cert-manager/cert-manager
  ref:
    tag: v1.20.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds-cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  path: "./deploy/crds"
  sourceRef:
    kind: GitRepository
    name: src-cert-manager
  targetNamespace: flux-system
  commonMetadata:
    labels:
      managed-by: flux
      app.kubernetes.io/part-of: homelab-infrastructure
