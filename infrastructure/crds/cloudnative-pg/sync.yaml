# infrastructure/crds/external-secrets/sync.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: src-cloudnative-pg
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/cloudnative-pg/cloudnative-pg
  ref:
    tag: v1.28.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds-cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 3m
  path: "./config/crd"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: src-cloudnative-pg
  targetNamespace: flu-system
