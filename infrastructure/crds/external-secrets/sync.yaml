# infrastructure/crds/external-secrets/sync.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: src-external-secrets
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/external-secrets/external-secrets
  ref:
    tag: v2.2.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds-external-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 3m
  path: "./deploy/charts/external-secrets/templates/crds"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: src-external-secrets
  targetNamespace: flux-system
