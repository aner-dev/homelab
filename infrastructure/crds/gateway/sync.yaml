# infrastructure/crds/external-secrets/sync.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: src-gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.5.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds-gateway-api
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 3m
  path: "./config/crd/standard"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: src-gateway-api
  targetNamespace: flux-system
