# infrastructure/crds/external-secrets/sync.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: src-longhorn
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/longhorn/longhorn/tree/master
  ref:
    tag: v1.11.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds-longhorn
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 3m
  path: "./charts/templates"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: src-longhorn
  targetNamespace: flux-system
