# --- Basic/Global Configuration ---
# Prioritizing modern TLS and explicit IP versioning
minTlsServeVersion: 1.3
connectIPVersion: v4

# --- Ports & Addresses ---
# Using the Gateway API persona model:
# The Infrastructure Provider (you) defines where the 'river' starts.
ports:
  dns: 53
  tls: 853
  http: 4000 # Used for Prometheus metrics & REST API
  https: 443 # Used for DoH (DNS over HTTPS)
certFile: /etc/blocky/certs/tls.crt
keyFile: /etc/blocky/certs/tls.key

# --- Logging Configuration ---
# Structured logging
log:
  level: info
  format: json # Use 'json' to pipe logs to Loki/Grafana
  timestamp: true
  privacy: false # Set to 'true' only if I need to hide the DNS history from logs

clientLookup:
  upstream: 10.96.0.10 # CoreDNS Service IP
  singleNameOrder:
    - 1 # Take the first name returned (usually the FQDN)

upstreams:
  groups:
    # High-Privacy Apps (Wildcard match for Pod names)
    "searxng*":
      - privacy
    "simplex*":
      - privacy
    # Artix Host (Physical Identity)
    192.168.100.239:
      - privacy
    127.0.0.1:
      - privacy

    # The Rest of the Cluster (The "Worker" CIDR)
    10.42.0.0/24:
      - velocity

    velocity:
      - https://1.1.1.1/dns-query # cloudflare
      - https://9.9.9.9/dns-query # quad9
    privacy:
      - https://all.dns.mullvad.net/dns-query # [sweden, gothenburg]
      - https://dns.quad9.net/dns-query # [switzerland]
      - https://doh.libredns.gr/dns-query # [greek]
      - https://protected.canadianshield.cira.ca/dns-query # [canada]
    default:
      - https://base.dns.mullvad.net/dns-query
      - https://adblock.dns.mullvad.net/dns-query
      - https://doh.libredns.gr/noads #
      - https://desec.io/dns-query

  strategy: random

# BOOTSTRAP: Solves the "Chicken & Egg" loop for DoH.
bootstrapDns:
  - https://1.1.1.1/dns-query # Use a reliable, fast Anycast IP to find the privacy upstreams
  - 8.8.8.8

conditional:
  fallbackUpstream: false # Tight security: don't ask Google for internal names
  mapping:
    cluster.local: 10.96.0.10
    athanor.local: 10.96.0.10
    # Reverse DNS for Pods (Important for clientLookup)
    42.10.in-addr.arpa: 10.96.0.10

customDNS:
  customTTL: 1h
  mapping:
    # this point to the Cilium LoadBalancer IP (*.athanor.local FQDNs convention)
    athanor.local: 192.168.1.192

# =========================================================
# GLOBAL POLICIES (Security & Observability)
# =========================================================

blocking:
  blackLists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads
  blockTTL: 1m

# --- PERFORMANCE LAYER ---
caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true # Senior choice: keeps your favorite sites "warm"
  prefetchThreshold: 5
  prefetchExpires: 2h

# --- OBSERVABILITY LAYER ---
# Note: Ensure your 'ports' section has an 'http' port defined (usually 4000)
prometheus:
  enable: true
  path: /metrics

# --- STATEFUL LAYER ---
# cache database
# Skip Redis for now to keep the architecture lean.

# --- QUERY LOGGING ---
queryLog:
  type: console # Keep it lean: logs go to stdout for 'kubectl logs'
  fields:
    - clientName # Since we set up clientLookup, this is very useful!
    - question
    - responseReason
    - duration

dnssec:
  validate: true

ede:
  enable: true
