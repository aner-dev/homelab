apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: blocky
  namespace: dns-system
spec:
  interval: 1h
  chart:
    spec:
      chart: blocky
      version: "11.0.0"
      sourceRef:
        kind: HelmRepository
        name: k8s-home-lab
        namespace: flux-system
  values:
    controller:
      replicas: 1 # Stick to 1 for now; DNS caching is simpler
