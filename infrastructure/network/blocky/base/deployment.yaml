apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: blocky
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blocky
  template:
    metadata:
      labels:
        app: blocky
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # A standard non-privileged user
        fsGroup: 1000

      serviceAccountName: blocky-sa
      automountServiceAccountToken: false

      containers:
        - name: blocky
          image: blocky # placeholder for production/kustomization.yaml
          args: ["--config", "/app/config/config.yaml"]
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 4000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: blocky-config
