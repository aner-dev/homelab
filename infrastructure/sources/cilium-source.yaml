# infrastructure/sources/cilium-source.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cilium-crds-git
  namespace: flux-system
spec:
  interval: 1h
  url: https://codeberg.org/your-org/cilium-crds.git # homelab's Codeberg URL
  ref:
    branch: main
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: cilium-crds-oci
  namespace: flux-system
spec:
  interval: 1h
  url: oci://harbor.your-home.local/library/cilium-crds # Future Internal DNS (Harbor)
