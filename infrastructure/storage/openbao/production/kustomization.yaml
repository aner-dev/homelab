apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

helmCharts:
  - name: openbao
    releaseName: openbao
    version: 0.4.0
    repo: https://openbao.github.io/openbao-helm
    includeCRDs: true
    valuesFile: values.yaml
    valuesInline:
      server:
        ha:
          replicas: 1
        image:
          tag: "2.5.0"
