# 1. Global Settings
redactions = ["*_TOKEN"]

# 2. Tools
[tools]
helm = "3.16.4"
jq = "1.8.1"
kubectl = "1.35"
kustomize = "5.7.0"
openbao = "2.4.4"
opentofu = "1.11.4"
vault = "1.21.2"
yq = "4.52.2"
"aqua:cilium/cilium-cli" = "0.19.2"
regctl = "0.11.2"
age = "1.3.1"
sops = "3.12.2"
act = "0.2.84"
dive = "0.13.1"
flux2 = "2.8.3"
yazi = "26.1.22"
atuin = "18.13.5"
"aqua:ast-grep/ast-grep" = "0.42.0"
"aqua:BurntSushi/ripgrep" = "15.1.0"
"aqua:google/go-containerregistry" = "latest"
"aqua:alexpasmantier/television" = "latest"
"github:cilium/hubble" = "latest"
"aqua:go-task/task" = "latest"
"aqua:charmbracelet/glow" = "latest"

# This globally masks any variable ending in _TOKEN in mise output

# 3. Environment (always last or separated)
[env]
# use the map syntax to ensure mise knows exactly where the file is
# then I can mark the file itself as sensitive
_.file = { path = ".env", redact = true }
# Enforce that the token MUST exist in the environment
CODEBERG_TOKEN = { required = "Create a .env file with your Codeberg PAT. See SETUP.md for scopes." }
KUBECONFIG = "{{config_root}}/.kubeconfig"
# Note: {{config_root}} is a mise template variable that points to the directory of the toml file.

# This tells Tofu/OpenBao to use the OpenBao naming conventions
BAO_ADDR = "http://vault.vault.svc.cluster.local:8200"
VAULT_ADDR = "http://vault.vault.svc.cluster.local:8200"

TF_VAR_openbao_addr = "http://localhost:8200"


# tasks config 
[task_config]
# This allows mise to find tasks even if I'm deep inside a subdirectory
includes = [".mise/tasks/**/*.sh", ".mise/tasks/**/run"]
# Ensures that even if I'm in /infrastructure/apps, 'mise run cluster:sync' works
dir = "{{config_root}}"

[tasks.tldrb]
description = "View tldr pages with bat coloring"
run = "tldr $1 | bat"
